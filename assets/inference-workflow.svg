<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="260" viewBox="0 0 1120 260" role="img" aria-labelledby="t d">
<title id="t">Retinal imaging prototype workflow</title><desc id="d">Fundus image input passes through preprocessing and a research classifier. Grad-CAM and a separate exploratory optic-disc heuristic are presented as non-clinical outputs.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1728"/><stop offset="1" stop-color="#142D45"/></linearGradient></defs>
<rect width="1120" height="260" rx="20" fill="url(#bg)"/>
<text x="32" y="38" fill="#F8FAFC" font-size="20" font-weight="700" font-family="Inter,Arial">Prototype inference workflow</text>
<text x="32" y="60" fill="#94A3B8" font-size="12" font-family="Inter,Arial">Outputs are for software experimentation and must not inform clinical decisions.</text>
<g><rect x="32" y="88" width="182" height="104" rx="14" fill="#142B42" stroke="#38BDF8" stroke-opacity=".7" stroke-width="2"/><circle cx="54" cy="111" r="11" fill="#38BDF8"/><text x="54" y="115" text-anchor="middle" fill="#07111F" font-size="11" font-weight="800" font-family="Inter,Arial">1</text><text x="123" y="143" text-anchor="middle" fill="#F8FAFC" font-size="16" font-weight="700" font-family="Inter,Arial">Fundus image</text><text x="123" y="165" text-anchor="middle" fill="#B9C7D8" font-size="12" font-family="Inter,Arial">Input</text></g><path d="M217 140 H240 l-7 -6 m7 6 l-7 6" stroke="#7DD3FC" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="250" y="88" width="182" height="104" rx="14" fill="#142B42" stroke="#38BDF8" stroke-opacity=".7" stroke-width="2"/><circle cx="272" cy="111" r="11" fill="#38BDF8"/><text x="272" y="115" text-anchor="middle" fill="#07111F" font-size="11" font-weight="800" font-family="Inter,Arial">2</text><text x="341" y="143" text-anchor="middle" fill="#F8FAFC" font-size="16" font-weight="700" font-family="Inter,Arial">Preprocess</text><text x="341" y="165" text-anchor="middle" fill="#B9C7D8" font-size="12" font-family="Inter,Arial">Crop + resize</text></g><path d="M435 140 H458 l-7 -6 m7 6 l-7 6" stroke="#7DD3FC" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="468" y="88" width="182" height="104" rx="14" fill="#142B42" stroke="#38BDF8" stroke-opacity=".7" stroke-width="2"/><circle cx="490" cy="111" r="11" fill="#38BDF8"/><text x="490" y="115" text-anchor="middle" fill="#07111F" font-size="11" font-weight="800" font-family="Inter,Arial">3</text><text x="559" y="143" text-anchor="middle" fill="#F8FAFC" font-size="16" font-weight="700" font-family="Inter,Arial">DR classifier</text><text x="559" y="165" text-anchor="middle" fill="#B9C7D8" font-size="12" font-family="Inter,Arial">EfficientNet-B3</text></g><path d="M653 140 H676 l-7 -6 m7 6 l-7 6" stroke="#7DD3FC" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="686" y="88" width="182" height="104" rx="14" fill="#142B42" stroke="#38BDF8" stroke-opacity=".7" stroke-width="2"/><circle cx="708" cy="111" r="11" fill="#38BDF8"/><text x="708" y="115" text-anchor="middle" fill="#07111F" font-size="11" font-weight="800" font-family="Inter,Arial">4</text><text x="777" y="143" text-anchor="middle" fill="#F8FAFC" font-size="16" font-weight="700" font-family="Inter,Arial">Visualize</text><text x="777" y="165" text-anchor="middle" fill="#B9C7D8" font-size="12" font-family="Inter,Arial">Grad-CAM</text></g><path d="M871 140 H894 l-7 -6 m7 6 l-7 6" stroke="#7DD3FC" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="904" y="88" width="182" height="104" rx="14" fill="#142B42" stroke="#FBBF24" stroke-opacity=".7" stroke-width="2"/><circle cx="926" cy="111" r="11" fill="#FBBF24"/><text x="926" y="115" text-anchor="middle" fill="#07111F" font-size="11" font-weight="800" font-family="Inter,Arial">5</text><text x="995" y="143" text-anchor="middle" fill="#F8FAFC" font-size="16" font-weight="700" font-family="Inter,Arial">Explore</text><text x="995" y="165" text-anchor="middle" fill="#B9C7D8" font-size="12" font-family="Inter,Arial">vCDR heuristic*</text></g>
<text x="32" y="224" fill="#FBBF24" font-size="12" font-family="Inter,Arial">* Experimental OpenCV estimate only; not a validated glaucoma screening or diagnostic output.</text>
</svg>